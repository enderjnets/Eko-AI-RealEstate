[alembic]
# Path to migration scripts (relative to this file)
script_location = migrations

# Template used to generate new migration files. Date prefix makes them sort cleanly.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# sys.path insertion — let migrations import `app.*` directly.
prepend_sys_path = .

# Timezone for timestamps in migration file headers
timezone = UTC

# Maximum length of characters to apply to the "slug" field
truncate_slug_length = 40

# Output settings
output_encoding = utf-8

# sqlalchemy.url is set dynamically in migrations/env.py from settings.DATABASE_URL
sqlalchemy.url = driver://user:pass@host/dbname

[post_write_hooks]
# Auto-format new migrations with ruff (if installed).
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
