[project]
name = "eko-ai-realestate-backend"
version = "0.0.1"
description = "Eko AI Realtors — backend (FastAPI + Kimi/MiniMax LLM + Postgres)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # `Depends(...)` / `Query(...)` in arg defaults IS the FastAPI idiom
    "UP042",  # `class X(str, enum.Enum)` is intentional — needed for pg_enum + JSON serialization
    "UP037",  # SQLAlchemy `Mapped["Model"]` forward-refs must stay quoted (imported under TYPE_CHECKING)
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers --tb=short"
