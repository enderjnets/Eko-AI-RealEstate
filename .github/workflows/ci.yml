name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eko
          POSTGRES_PASSWORD: eko
          POSTGRES_DB: eko_realestate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eko"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Real Postgres service above → the DB-backed tests actually run (not skipped).
      DATABASE_URL: "postgresql+asyncpg://eko:eko@localhost:5432/eko_realestate"
      # CI must exercise the tenant policies, so the suite connects as the
      # non-superuser role the migration creates. Without this the tests fall
      # back to the owner, Postgres skips RLS entirely, and every isolation test
      # passes while proving nothing — the exact false green they exist to catch.
      DATABASE_URL_APP: "postgresql+asyncpg://eko_app:eko_app_local_pass@localhost:5432/eko_realestate"
      # Set because `config.py` declares it, not because anything connects:
      # nothing under `backend/app/` imports redis. A CI service for it would be
      # latency with no consumer; this value just satisfies the settings model.
      REDIS_URL: "redis://localhost:6379/0"
      KIMI_API_KEY: "ci-dummy"
      MINIMAX_API_KEY: "ci-dummy"
      WHATSAPP_APP_SECRET: "ci-dummy"
      WHATSAPP_VERIFY_TOKEN: "ci-dummy"
      # The suite exercises the WhatsApp channel, so it has to be on here.
      # Production default is false — `test_whatsapp_channel.py` covers the
      # disabled behaviour explicitly rather than relying on this being unset.
      WHATSAPP_ENABLED: "true"
      WHATSAPP_SIMULATED: "true"
      APP_ENV: "test"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Tests (pytest)
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend (tsc + test + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Lint
        working-directory: frontend
        run: npm run lint
